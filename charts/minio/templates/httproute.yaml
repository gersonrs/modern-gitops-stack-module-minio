{{- if .Values.minio.httproute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
spec:
  parentRefs:
    - name: {{ .Values.minio.httproute.gateway_name | default "istio-gateway" }}
      namespace: {{ .Values.minio.httproute.gateway_namespace | default "istio-ingress" }}
      sectionName: https
  hostnames:
    - {{ .Values.minio.httproute.host | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-console
          port: 9001
{{- end }}
{{- if and .Values.minio.httproute.enabled .Values.minio.httproute.api_host }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-api
spec:
  parentRefs:
    - name: {{ .Values.minio.httproute.gateway_name | default "istio-gateway" }}
      namespace: {{ .Values.minio.httproute.gateway_namespace | default "istio-ingress" }}
      sectionName: https
  hostnames:
    - {{ .Values.minio.httproute.api_host | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: 9000
{{- end }}
